<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200">
  <defs>
    <style>
      .label { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #555555; }
      .val { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #000000; }
      .heading { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #000000; letter-spacing: -0.01em; }
      .sub { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #777777; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="849" height="199" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Left Section: Architecture Metrics -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" class="heading">Autonomous System &amp; Engine Telemetry</text>
    <text x="0" y="18" class="sub">16 STAGE-GATED AGENTS · 85 SKILLS · 1,425 KNOWLEDGE ROWS</text>

    <g transform="translate(0, 42)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" class="label">Stage-Gated Agents</text>
        <text x="155" y="0" class="val">16 Specialists</text>
      </g>
      <!-- Metric 2 -->
      <g transform="translate(0, 25)">
        <text x="0" y="0" class="label">Execution Skills</text>
        <text x="155" y="0" class="val">85 Actions</text>
      </g>
      <!-- Metric 3 -->
      <g transform="translate(0, 50)">
        <text x="0" y="0" class="label">Knowledge Database</text>
        <text x="155" y="0" class="val">1,425 Rows</text>
      </g>
      <!-- Metric 4 -->
      <g transform="translate(0, 75)">
        <text x="0" y="0" class="label">Target Verticals</text>
        <text x="155" y="0" class="val">30 Industries</text>
      </g>
    </g>

    <!-- Score Badge -->
    <g transform="translate(345, 80)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#e5e5e5" stroke-width="4"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="201" stroke-dashoffset="20" stroke-linecap="round"/>
      <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#000000">95</text>
      <text x="0" y="52" text-anchor="middle" class="sub">READINESS</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="425" y1="20" x2="425" y2="180" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Right Section: Protocol Distribution -->
  <g transform="translate(455, 26)">
    <text x="0" y="0" class="heading">Execution Discipline &amp; Runtime Stack</text>
    <text x="0" y="18" class="sub">PLAN → REVIEW → APPROVE → EXECUTE PROTOCOL</text>

    <!-- Progress Bar (Monochrome Shading) -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="365" height="8" rx="4" fill="#f0f0f0"/>
      <!-- Ideate & Validate (35%) -->
      <rect x="0" y="0" width="130" height="8" rx="4" fill="#000000"/>
      <!-- Build & Craft (30%) -->
      <rect x="132" y="0" width="105" height="8" fill="#333333"/>
      <!-- Market / LOTUS (20%) -->
      <rect x="239" y="0" width="70" height="8" fill="#666666"/>
      <!-- Operate & Scale (15%) -->
      <rect x="311" y="0" width="54" height="8" rx="4" fill="#999999"/>
    </g>

    <!-- 4-Tier Clean List with End Alignment -->
    <g transform="translate(0, 60)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <circle cx="5" cy="5" r="4" fill="#000000"/>
        <text x="18" y="9" class="label">Ideation &amp; Validation</text>
        <text x="365" y="9" class="val" text-anchor="end">Stage 1–2</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(0, 25)">
        <circle cx="5" cy="5" r="4" fill="#333333"/>
        <text x="18" y="9" class="label">Tactile Build &amp; EaseUI</text>
        <text x="365" y="9" class="val" text-anchor="end">Stage 3</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(0, 50)">
        <circle cx="5" cy="5" r="4" fill="#666666"/>
        <text x="18" y="9" class="label">Market (LOTUS Outbound Pipeline)</text>
        <text x="365" y="9" class="val" text-anchor="end">Stage 4</text>
      </g>
      <!-- Row 4 -->
      <g transform="translate(0, 75)">
        <circle cx="5" cy="5" r="4" fill="#999999"/>
        <text x="18" y="9" class="label">Operate &amp; Scale (Claude Code Runtime)</text>
        <text x="365" y="9" class="val" text-anchor="end">Stage 5</text>
      </g>
    </g>
  </g>
</svg>
